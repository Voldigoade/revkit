name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.3
          cache: true
      - name: Build release binary
        env:
          VERSION: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath -buildvcs=false \
            -ldflags "-s -w -X main.version=$VERSION -X main.commit=$COMMIT" \
            -o dist/revkit-linux-amd64 ./cmd/revkit
          cd dist
          sha256sum revkit-linux-amd64 > SHA256SUMS
      - name: Attest release binary
        uses: actions/attest@v4
        with:
          subject-path: dist/revkit-linux-amd64
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sh scripts/create-release.sh "$GITHUB_REF_NAME" dist/revkit-linux-amd64 dist/SHA256SUMS
